# Builds the docs site (go run ./cmd/site) and publishes it on GitHub Pages
# at irie-people.github.io/roots, for every push to main.
name: pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
        with: { persist-credentials: false }
      - uses: actions/setup-go@v5
        with: { go-version-file: go.mod }
      - run: go run ./cmd/site -out _site
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with: { path: _site }
      - id: deployment
        uses: actions/deploy-pages@v5
